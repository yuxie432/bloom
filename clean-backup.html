<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bloom · clean backup</title>
<style>
  :root { --brand:#6f4e37; --bg:#f6f1ea; --card:#fff; --ink:#2b2019; --muted:#8a7c6f; --line:#e7ddd0; --accent:#c98a3d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.5; padding:28px 18px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; color:var(--brand); }
  p { font-size:14px; color:var(--muted); margin:6px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:16px;
          box-shadow:0 2px 10px rgba(80,55,30,.08); }
  label.drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center;
               cursor:pointer; color:var(--brand); font-weight:600; }
  label.drop:hover { border-color:var(--accent); }
  input[type=file] { display:none; }
  .log { margin-top:14px; font-size:13px; white-space:pre-wrap; color:var(--ink); }
  .ok { color:#4c9a5b; font-weight:600; }
  .err { color:#c25a4d; font-weight:600; }
  code { background:#f0e8dd; padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌸 Clean a Bloom backup</h1>
  <p>Removes the old tasting scales (<code>aroma, acidity, sweetness, body, bitterness, aftertaste</code>)
     from every brew. Everything else — ratings, flavour notes, brew notes, beans, settings — is kept exactly as-is.
     A cleaned <code>.json</code> downloads automatically; import it via <b>⋮ → Import backup</b>.</p>
  <div class="card">
    <label class="drop" for="file">Click to choose your <code>bloom-backup-….json</code></label>
    <input id="file" type="file" accept="application/json,.json" />
    <div id="log" class="log"></div>
  </div>
</div>
<script>
const SCALE_KEYS = ['aroma','acidity','sweetness','body','bitterness','aftertaste'];
const log = document.getElementById('log');
document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  log.innerHTML = 'Reading ' + f.name + ' …';
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.brews)) {
      log.innerHTML = '<span class="err">That file has no "brews" array — is it a Bloom backup?</span>';
      return;
    }
    let removed = 0, touched = 0;
    for (const b of data.brews) {
      let hit = false;
      for (const k of SCALE_KEYS) {
        if (Object.prototype.hasOwnProperty.call(b, k)) { delete b[k]; removed++; hit = true; }
      }
      if (hit) touched++;
    }
    const out = JSON.stringify(data, null, 2);
    const name = f.name.replace(/\.json$/i, '') + '-cleaned.json';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type:'application/json' }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    log.innerHTML = '<span class="ok">Done.</span> ' + data.brews.length + ' brews checked · ' +
      touched + ' had scale fields · ' + removed + ' fields removed.\nDownloaded: ' + name;
  } catch (err) {
    log.innerHTML = '<span class="err">Could not process: ' + (err.message || err) + '</span>';
  }
});
</script>
</body>
</html>
